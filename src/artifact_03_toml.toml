[package]
name = "daejin_market"
version = "0.1.0"
description = "Institutional Prediction & Continuous Parimutuel AMM on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "daejin_market"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }
solana-program = "=1.18.26"