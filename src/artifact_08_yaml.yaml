version: "3.8"

services:
  daejin-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daejin-market-agent
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - WALLET_KEYPAIR_PATH=/workspace/.keypair/deployer.json
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_test_000000000000000000000000
      - ALERT_EMAIL=admin@enterprise.com
    volumes:
      - ./.keypair:/workspace/.keypair:ro
      - ./logs:/workspace/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8080:8080"