version: '3.8'

services:
  daejin-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daejin-orchestrator
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      - DAEJIN_PROGRAM_ID=${DAEJIN_PROGRAM_ID:-Daejin1111111111111111111111111111111111111}
      - TWITTER_API_KEY=${TWITTER_API_KEY}
      - TWITTER_API_SECRET=${TWITTER_API_SECRET}
      - TWITTER_ACCESS_TOKEN=${TWITTER_ACCESS_TOKEN}
      - TWITTER_ACCESS_SECRET=${TWITTER_ACCESS_SECRET}
      - ENTERPRISE_DISCORD_WEBHOOK=${ENTERPRISE_DISCORD_WEBHOOK}
    volumes:
      - ./keys:/usr/src/app/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e 'console.log(process.uptime())'"]
      interval: 30s
      timeout: 10s
      retries: 3