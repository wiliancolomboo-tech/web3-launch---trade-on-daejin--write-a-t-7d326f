version: "3.8"

services:
  daejin-market-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daejin-market-daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=Daej1nMarket11111111111111111111111111111111
      - WALLET_KEYPAIR_PATH=/secrets/id.json
      - ENTERPRISE_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3